# One-command CSB demo stack (EVM devnet, no avalanchego required):
#
#   docker compose -f docker-compose.demo.yml up --build
#   open http://localhost:8080  (passcode: value of EXPLORER_PASSCODE, default csb-demo)
#
# Services:
#   chain    - Hardhat EVM devnet (in-network only; not exposed on the host)
#   deployer - one-shot: deploys the contract suite and seeds demo data
#   demo     - gated demo server (wallet / explorer / admin) on :8080
#
# For a real Avalanche L1 validator node, see docker-compose.validator.yml.
services:
  chain:
    build: .
    command: npx hardhat node --hostname 0.0.0.0 --port 8545
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20

  deployer:
    build: .
    depends_on:
      chain:
        condition: service_healthy
    environment:
      CSB_DEPLOYMENTS_FILE: /data/deployments.json
    volumes:
      - demo-data:/data
    command: >
      sh -c "npx hardhat run scripts/deploy.js --network docker &&
             npx hardhat run scripts/seed-demo.js --network docker"
    restart: "no"

  demo:
    build: .
    depends_on:
      deployer:
        condition: service_completed_successfully
    environment:
      CSB_RPC_URL: http://chain:8545
      CSB_DEPLOYMENTS_FILE: /data/deployments.json
      EXPLORER_PASSCODE: ${EXPLORER_PASSCODE:-csb-demo}
    volumes:
      - demo-data:/data:ro
    ports:
      - "8080:8080"

volumes:
  demo-data:
